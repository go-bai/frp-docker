# Server Example - Run FRP in server mode
version: '3.8'

services:
  frp-server:
    build: .
    container_name: frp-server-example
    hostname: frp-server
    restart: unless-stopped
    network_mode: host
    environment:
      - FRP_MODE=server
      - FRP_VERSION=latest
      - FRP_SERVER_PORT=7000
      - FRP_WEB_PORT=7500
      - FRP_LOG_LEVEL=info
    volumes:
      - ./data/server:/app/configs
      - ./logs/server:/app/logs
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# To run:
# 1. docker-compose -f examples/server.yml up -d
# 2. Check logs: docker-compose -f examples/server.yml logs -f
# 3. Get auth token: docker exec frp-server-example cat /app/configs/server_auth.txt