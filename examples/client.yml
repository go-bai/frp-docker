# Client Example - Run FRP in client mode
version: '3.8'

services:
  frp-client:
    build: .
    container_name: frp-client-example
    hostname: frp-client
    restart: unless-stopped
    network_mode: host  # Or use container networking
    environment:
      - FRP_MODE=client
      - FRP_VERSION=latest
      - FRP_SERVER_ADDR=YOUR_SERVER_IP  # Replace with actual server IP
      - FRP_SERVER_PORT=7000
      - FRP_TOKEN=YOUR_AUTH_TOKEN  # Replace with actual token
      - FRP_LOG_LEVEL=info
    volumes:
      - ./data/client:/app/configs
      - ./logs/client:/app/logs
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# To run:
# 1. Replace YOUR_SERVER_IP and YOUR_AUTH_TOKEN with actual values
# 2. docker-compose -f examples/client.yml up -d
# 3. Access CLI: docker exec -it frp-client-example /app/scripts/frp_cli.sh
# 4. Check logs: docker-compose -f examples/client.yml logs -f