# Persistent volumes for configuration and logs
volumes:
  frp_server_data:
    driver: local
    labels:
      - "description=FRP Server configuration data"
  frp_server_logs:
    driver: local
    labels:
      - "description=FRP Server logs"
  frp_client_data:
    driver: local
    labels:
      - "description=FRP Client configuration data"
  frp_client_logs:
    driver: local
    labels:
      - "description=FRP Client logs"
  frp_sidecar_data:
    driver: local
    labels:
      - "description=FRP Sidecar configuration data"
  frp_sidecar_logs:
    driver: local
    labels:
      - "description=FRP Sidecar logs"

