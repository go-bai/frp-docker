version: '3.8'

# FRP Docker Compose - Enterprise Grade Configuration
# Supports both client and server deployments
# Author: Claude Code AI Assistant

services:
  # FRP Server Service
  frp-server:
    build: .
    container_name: frp-server
    hostname: frp-server
    restart: unless-stopped
    network_mode: host  # Required for server mode
    environment:
      - FRP_MODE=server
      - FRP_VERSION=latest
      - FRP_SERVER_PORT=7000
      - FRP_WEB_PORT=7500
      - FRP_LOG_LEVEL=info
    volumes:
      - frp_server_data:/app/configs
      - frp_server_logs:/app/logs
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.docker.compose.service=frp-server"
      - "description=FRP Server for secure tunneling"

  # FRP Client Service (commented out by default)
