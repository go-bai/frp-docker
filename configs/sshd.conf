[program:sshd]
command=/usr/sbin/sshd -D -p 22222 -e
autostart=false
autorestart=true
stdout_logfile=/app/logs/sshd_stdout.log
stderr_logfile=/app/logs/sshd_stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
priority=10
user=root
startsecs=3
startretries=3
stopwaitsecs=10
